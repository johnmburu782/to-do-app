<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div>
        <h1>My To-Do List</h1>
        <p>Plan, Organize, Get Things Done.</p>
      </div>
      <svg class="header-icon" viewBox="0 0 120 120" aria-hidden="true">
        <rect x="22" y="12" width="76" height="96" rx="12" fill="#fff"/>
        <rect x="44" y="6" width="32" height="16" rx="6" fill="#0866E8"/>
        <path d="M34 42l7 7 13-14" fill="none" stroke="#078A38" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M34 70l7 7 13-14" fill="none" stroke="#078A38" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="62" y="40" width="26" height="6" rx="3" fill="#CBD5E1"/>
        <rect x="62" y="68" width="26" height="6" rx="3" fill="#CBD5E1"/>
        <rect x="34" y="92" width="54" height="6" rx="3" fill="#CBD5E1"/>
      </svg>
    </div>
  </header>

  <main class="container">
    <!-- Add task -->
    <section class="card">
      <form id="task-form" class="task-form" novalidate>
        <input id="task-input" type="text" placeholder="What do you need to do?" maxlength="120" aria-label="Task description" autocomplete="off">
        <input id="task-date" type="date" aria-label="Deadline">
        <button type="submit" class="btn btn-green">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          Add Task
        </button>
      </form>
      <p id="form-error" class="form-error" role="alert"></p>
    </section>

    <!-- Productivity dashboard -->
    <section class="card dashboard" aria-label="Productivity summary">
      <div class="stats">
        <div class="stat"><strong id="stat-total">0</strong><span>Total</span></div>
        <div class="stat"><strong id="stat-done" class="green">0</strong><span>Completed</span></div>
        <div class="stat"><strong id="stat-pending" class="blue">0</strong><span>Pending</span></div>
        <div class="stat"><strong id="stat-percent">0%</strong><span>Done</span></div>
      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p id="progress-text" class="muted">0 of 0 tasks completed<br>0% productivity progress.</p>
    </section>

    <!-- Filters, search, task list -->
    <section class="card">
      <div class="toolbar">
        <nav class="filters" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all">All Tasks</button>
          <button class="filter-btn" data-filter="completed">Completed Tasks</button>
          <button class="filter-btn" data-filter="pending">Pending Tasks</button>
        </nav>
        <input id="search-input" type="search" placeholder="Search tasks..." aria-label="Search tasks">
      </div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty" hidden></p>

      <div class="footer">
        <button id="clear-all" class="btn btn-red">Clear All Tasks</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
